spring.application.name=demo
server.port=${PORT:8080}

# Okta: Das Backend prüft bei jeder Anfrage das Access Token aus dem Frontend.
# OKTA_ISSUER steht in der Okta-Admin-Konsole unter Security > API > Authorization Servers > default (Issuer URI).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OKTA_ISSUER:https://integrator-8664645.okta.com/oauth2/default}
spring.security.oauth2.resourceserver.jwt.audiences=${OKTA_AUDIENCE:api://default}

# Datenbank: PostgreSQL auf Render. Zugangsdaten nur als Umgebungsvariablen, nie im Repo!
# DB_URL beginnt mit jdbc:postgresql://HOST/DB (ohne User und Passwort).
# Ohne Variablen (z. B. in den Tests) nutzt Spring eine H2-Datenbank im Arbeitsspeicher.
spring.datasource.url=${DB_URL:jdbc:h2:mem:shoppinglist}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
